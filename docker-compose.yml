services:
  # baza #
  db:
    image: postgres:15-alpine
    container_name: kmetija_db
    restart: always
    # slovenski čas #
    command: postgres -c timezone=Europe/Ljubljana
    environment:
      POSTGRES_USER: user_kmetija
      POSTGRES_PASSWORD: geslo_kmetija
      POSTGRES_DB: kmetija_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # flask #
  backend:
    build: ./backend
    container_name: kmetija_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user_kmetija:geslo_kmetija@db:5432/kmetija_db
      - SECRET_KEY=razvojni_kljuc_kmetija_spremeni_me
      - FRONTEND_DIR=/app/frontend
      - SLIKE_DIR=/app/slike
    volumes:
      # predloge #
      - ./frontend:/app/frontend:ro
      # slike izdelkov #
      - slike_izdelkov:/app/slike
    depends_on:
      - db

  # nginx #
  frontend:
    build: ./frontend
    container_name: kmetija_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  slike_izdelkov: